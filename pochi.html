<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fuuka.log — ぽち</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=DotGothic16&family=Cormorant+Garamond:ital,wght@1,500&display=swap');

  :root {
    --bg-1: #fff4d6;
    --bg-2: #ffd6e7;
    --bg-3: #c8e7ff;
    --ink: #3d2e2a;
    --ink-soft: #8a6f6a;
    --accent: #ff7a9e;
    --accent-2: #ffb84d;
    --success: #7fc99e;
    --danger: #ff6b6b;
    --card: #fffaf0;
    --shadow: 0 4px 0 rgba(61, 46, 42, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.4) 1px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.3) 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.4) 1px, transparent 2px);
    background-size: 100px 100px, 150px 150px, 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 100px;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0 12px;
  }
  .back-link {
    background: rgba(255, 255, 255, 0.6);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 6px 12px;
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }
  .topbar-title {
    flex: 1;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 500;
  }
  .topbar-title .dot { color: var(--accent); }
  .topbar-spacer { width: 56px; }

  /* ===== ぽちのステージ ===== */
  .stage {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 28px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, rgba(255, 184, 77, 0.15), transparent 60%);
    pointer-events: none;
  }
  .stage-name {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .stage-level {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .stage-level .heart {
    display: inline-block;
    margin-left: 6px;
    font-size: 14px;
  }
  .pochi-svg {
    width: 200px;
    height: 200px;
    margin: 0 auto;
    display: block;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }
  .stage-mood {
    font-size: 15px;
    font-weight: 700;
    margin-top: 8px;
    min-height: 22px;
  }

  /* ===== 経験値バー ===== */
  .exp-bar {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .exp-bar-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .exp-bar-head .label { font-weight: 700; }
  .exp-bar-head .value { color: var(--ink-soft); }
  .exp-bar-track {
    height: 14px;
    background: rgba(0,0,0,0.08);
    border: 2px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .exp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.5s ease-out;
    border-radius: 4px;
  }
  .next-info {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 6px;
    text-align: center;
  }
  .next-info b { color: var(--ink); }

  /* ===== 会話エリア ===== */
  .talk-area {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .talk-bubble {
    background: var(--bg-1);
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 12px;
    position: relative;
    min-height: 60px;
    font-size: 14px;
    line-height: 1.5;
  }
  .talk-bubble::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 24px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 10px solid var(--ink);
  }
  .talk-bubble::after {
    content: '';
    position: absolute;
    top: -7px;
    left: 26px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 8px solid var(--bg-1);
  }
  .talk-input-row {
    display: flex;
    gap: 6px;
  }
  .talk-input-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: white;
    outline: none;
  }
  .talk-send-btn {
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    background: var(--accent);
    color: white;
    border: 2px solid var(--ink);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
  }
  .talk-send-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

  .talk-hints {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .talk-hint {
    padding: 4px 10px;
    font-size: 11px;
    background: white;
    border: 1.5px solid var(--ink-soft);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink-soft);
  }
  .talk-hint:hover { background: var(--bg-1); color: var(--ink); }

  /* ===== ステータス ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .stat-card .lbl {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }
  .stat-card.amber .num { color: var(--accent-2); }
  .stat-card.green .num { color: var(--success); }

  /* ===== 成長履歴 ===== */
  .growth {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .growth-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
  }
  .growth-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed var(--ink-soft);
    font-size: 13px;
  }
  .growth-row:last-child { border-bottom: none; }
  .growth-source { color: var(--ink); }
  .growth-value { font-weight: 700; color: var(--success); }

  /* 進化エフェクト */
  .evolve-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    padding: 20px;
  }
  .evolve-overlay.show { display: flex; }
  .evolve-text {
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 14px;
    animation: pop 0.6s ease-out;
  }
  .evolve-text .new-name {
    color: var(--accent);
    font-size: 32px;
    display: block;
    margin-top: 6px;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .evolve-svg {
    width: 220px;
    height: 220px;
    animation: pop 0.8s ease-out 0.2s both;
  }
  .evolve-btn {
    margin-top: 20px;
    padding: 14px 30px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    background: var(--accent);
    color: white;
    border: 3px solid var(--ink);
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
  }
  .evolve-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
</style>
</head>

</div>

<script>
// ===== データ管理 =====
const POCHI_KEY = 'fuukalog_pochi_v1';
const TODOS_KEY = 'fuukalog_todos_v1';
const WAKEUP_KEY = 'mochimaru_wakeup_v2';
const DIARY_KEY = 'fuukalog_diary_v1';

const defaultData = {
  exp: 0,
  totalTalks: 0,
  bornAt: new Date().toISOString(),
  lastTalkAt: null,
  lastChecked: { wakeupCleared: [], diaryDates: [], todoDone: [] },
  growthLog: { talk: 0, wakeup: 0, diary: 0, todo: 0, bonus: 0 },
  hearts: 3
};

function loadData() {
  try {
    const s = localStorage.getItem(POCHI_KEY);
    if (s) return { ...defaultData, ...JSON.parse(s) };
  } catch (e) {}
  return { ...defaultData };
}
function saveData() { localStorage.setItem(POCHI_KEY, JSON.stringify(state)); }

let state = loadData();

// ===== 進化段階定義 =====
const STAGES = [
  { name: 'たまご',     min: 0,    max: 20,   svg: 'egg',     hearts: 1 },
  { name: 'ぽち',       min: 20,   max: 80,   svg: 'baby',    hearts: 2 },
  { name: 'ぽちろう',   min: 80,   max: 200,  svg: 'child',   hearts: 3 },
  { name: 'ぽちまる',   min: 200,  max: 500,  svg: 'adult',   hearts: 4 },
  { name: 'ぽちはかせ', min: 500,  max: 1500, svg: 'doctor',  hearts: 5 },
  { name: 'ぽちのかみ', min: 1500, max: Infinity, svg: 'god', hearts: 5 }
];

function getStage(exp) {
  for (let i = STAGES.length - 1; i >= 0; i--) {
    if (exp >= STAGES[i].min) return { ...STAGES[i], index: i };
  }
  return { ...STAGES[0], index: 0 };
}

// ===== 気分判定 =====
function getMood() {
  if (!state.lastTalkAt) return 'neutral';
  const since = Date.now() - new Date(state.lastTalkAt).getTime();
  const hours = since / (1000 * 60 * 60);
  if (hours > 24 * 3) return 'lonely';     // 3日以上音沙汰なし
  if (hours > 24) return 'wondering';      // 1日以上
  if (hours < 0.5) return 'excited';       // 直近30分以内
  return 'happy';
}

// ===== 経験値追加 =====
function addExp(amount, source = 'talk') {
  const before = state.exp;
  const beforeStage = getStage(before);
  state.exp += amount;
  state.growthLog[source] = (state.growthLog[source] || 0) + amount;
  const afterStage = getStage(state.exp);
  saveData();
  // 進化判定
  if (afterStage.index > beforeStage.index) {
    showEvolveEffect(afterStage);
  }
}

// ===== 他のアプリのデータから経験値を取り込む =====
function syncFromOtherApps() {
  // 起床ゲームのクリア履歴
  try {
    const wakeup = JSON.parse(localStorage.getItem(WAKEUP_KEY) || '{}');
    const history = wakeup.history || [];
    const okDates = history.filter(h => h.result === 'ok').map(h => h.date);
    const newOks = okDates.filter(d => !state.lastChecked.wakeupCleared.includes(d));
    if (newOks.length > 0) {
      addExp(newOks.length * 10, 'wakeup');
      state.lastChecked.wakeupCleared.push(...newOks);
    }
  } catch (e) {}

  // 日記の書いた日
  try {
    const diary = JSON.parse(localStorage.getItem(DIARY_KEY) || '{}');
    const writtenDates = Object.keys(diary).filter(k => {
      const e = diary[k];
      return e && (e.mood || (e.good1 && e.good1.trim()) ||
                   (e.good2 && e.good2.trim()) || (e.good3 && e.good3.trim()) ||
                   (e.free && e.free.trim()));
    });
    const newDiaries = writtenDates.filter(d => !state.lastChecked.diaryDates.includes(d));
    if (newDiaries.length > 0) {
      addExp(newDiaries.length * 5, 'diary');
      state.lastChecked.diaryDates.push(...newDiaries);
    }
  } catch (e) {}

  // 完了済みTODO
  try {
    const todos = JSON.parse(localStorage.getItem(TODOS_KEY) || '[]');
    const doneIds = todos.filter(t => t.done).map(t => t.id);
    const newDones = doneIds.filter(id => !state.lastChecked.todoDone.includes(id));
    if (newDones.length > 0) {
      addExp(newDones.length * 2, 'todo');
      state.lastChecked.todoDone.push(...newDones);
    }
  } catch (e) {}

  saveData();
}

function generateReply(userText) {
  const stage = getStage(state.exp);
  const stageKey = stage.svg;

  for (const p of REPLY_PATTERNS) {
    if (p.match.test(userText)) {
      const list = p.replies[stageKey] || FALLBACK_REPLIES[stageKey];
      return list[Math.floor(Math.random() * list.length)];
    }
  }
  const list = FALLBACK_REPLIES[stageKey];
  return list[Math.floor(Math.random() * list.length)];
}

// ===== 進化エフェクト =====
function showEvolveEffect(newStage) {
  document.getElementById('evolveNewName').textContent = newStage.name;
  document.getElementById('evolveSvgContainer').innerHTML = renderPochi(newStage.svg, 220);
  document.getElementById('evolveOverlay').classList.add('show');
}
document.getElementById('evolveCloseBtn').addEventListener('click', () => {
  document.getElementById('evolveOverlay').classList.remove('show');
  render();
});

// ===== レンダリング =====
function render() {
  const stage = getStage(state.exp);
  document.getElementById('stageName').textContent = `STAGE ${stage.index + 1} / ${STAGES.length}`;
  document.getElementById('pochiName').textContent = stage.name;
  document.getElementById('pochiHearts').textContent = '♥'.repeat(stage.hearts);
  document.getElementById('pochiContainer').innerHTML = renderPochi(stage.svg);

  // 経験値バー
  const inStage = state.exp - stage.min;
  const stageSpan = stage.max === Infinity ? Math.max(state.exp - stage.min, 1) : stage.max - stage.min;
  const pct = stage.max === Infinity ? 100 : Math.min(100, (inStage / stageSpan) * 100);
  document.getElementById('expFill').style.width = pct + '%';
  document.getElementById('expValue').textContent =
    stage.max === Infinity ? `${state.exp}（カンスト！）` : `${state.exp} / ${stage.max}`;

  // 次の段階
  const nextInfo = document.getElementById('nextInfo');
  if (stage.index < STAGES.length - 1) {
    const next = STAGES[stage.index + 1];
    nextInfo.innerHTML = `あと <b>${next.min - state.exp}</b> でしんか →「${next.name}」`;
  } else {
    nextInfo.innerHTML = `最終形態だよ！`;
  }

  // 気分メッセージ
  const mood = getMood();
  const moodMessages = {
    neutral:    'はじめまして…',
    excited:    '🌟 すごくうれしそう',
    happy:      '😊 ごきげん',
    wondering:  '🤔 ちょっとひまそう',
    lonely:     '😢 さみしそう...'
  };
  document.getElementById('pochiMood').textContent = moodMessages[mood] || '';

  // ステータス
  document.getElementById('totalTalks').textContent = state.totalTalks;
  const days = Math.floor((Date.now() - new Date(state.bornAt).getTime()) / (1000 * 60 * 60 * 24));
  document.getElementById('ageInDays').textContent = days;

  // 成長履歴
  const sources = [
    { key: 'talk',   label: '💬 会話',     unit: 'XP' },
    { key: 'wakeup', label: '🌅 起床クリア', unit: 'XP' },
    { key: 'diary',  label: '📔 日記',     unit: 'XP' },
    { key: 'todo',   label: '✅ TODO完了', unit: 'XP' },
    { key: 'bonus',  label: '🎁 ボーナス', unit: 'XP' }
  ];
  document.getElementById('growthSources').innerHTML = sources.map(s => `
    <div class="growth-row">
      <span class="growth-source">${s.label}</span>
      <span class="growth-value">+${state.growthLog[s.key] || 0} ${s.unit}</span>
    </div>
  `).join('');
}

// ===== 会話 =====
function talk(userText) {
  if (!userText.trim()) return;
  state.totalTalks++;
  state.lastTalkAt = new Date().toISOString();
  saveData();

  // 経験値（会話は+1、長い文は+2）
  addExp(userText.length > 15 ? 2 : 1, 'talk');

  // 返事
  const reply = generateReply(userText);
  document.getElementById('pochiTalk').textContent = reply;

  render();
}

document.getElementById('talkSendBtn').addEventListener('click', () => {
  const input = document.getElementById('talkInput');
  talk(input.value);
  input.value = '';
});

document.getElementById('talkInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    talk(e.target.value);
    e.target.value = '';
  }
});

document.querySelectorAll('.talk-hint').forEach(btn => {
  btn.addEventListener('click', () => {
    talk(btn.dataset.hint);
  });
});

// ===== 初期化 =====
syncFromOtherApps();
render();

if (state.totalTalks === 0) {
  document.getElementById('pochiTalk').textContent = 'はじめまして…（たまごから何か聞こえる）話しかけてみて？';

  } else {
    const reply = generateReply('');
    document.getElementById('pochiTalk').textContent = reply;
  }
}
