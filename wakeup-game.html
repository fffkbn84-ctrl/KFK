<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>もちまる起床ゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=DotGothic16&display=swap');

  :root {
    --bg-1: #fff4d6;
    --bg-2: #ffd6e7;
    --bg-3: #c8e7ff;
    --ink: #3d2e2a;
    --ink-soft: #8a6f6a;
    --accent: #ff7a9e;
    --accent-2: #ffb84d;
    --success: #7fc99e;
    --danger: #ff6b6b;
    --card: #fffaf0;
    --shadow: 0 4px 0 rgba(61, 46, 42, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.4) 1px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.3) 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.4) 1px, transparent 2px);
    background-size: 100px 100px, 150px 150px, 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 4px 0 8px;
  }
  .back-link {
    background: rgba(255, 255, 255, 0.6);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 6px 12px;
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }
  .topbar-spacer { flex: 1; }

  .header { text-align: center; padding: 16px 0 24px; }
  .header h1 { font-size: 22px; font-weight: 900; letter-spacing: 0.05em; }
  .header .sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 0.1em;
  }

  .mochi-stage {
    background: var(--card);
    border-radius: 28px;
    padding: 24px 20px;
    box-shadow: var(--shadow);
    border: 3px solid var(--ink);
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .mochi-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, rgba(255, 184, 77, 0.15), transparent 60%);
    pointer-events: none;
  }
  .mochi-svg {
    width: 180px;
    height: 180px;
    margin: 0 auto;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .mochi-message {
    font-size: 16px;
    font-weight: 700;
    margin-top: 12px;
    min-height: 24px;
  }
  .mochi-message.success { color: var(--success); }
  .mochi-message.danger { color: var(--danger); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 14px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat .num {
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .stat .label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }
  .stat.best .num { color: var(--accent-2); }

  .today {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .today-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .today-head .day { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.08em; }
  .today-head .shift-name {
    font-size: 14px;
    font-weight: 700;
    background: var(--bg-1);
    padding: 4px 12px;
    border-radius: 20px;
    border: 2px solid var(--ink);
  }
  .today-head .shift-name.unset {
    background: #eee;
    color: var(--ink-soft);
  }
  .today-time { text-align: center; margin: 12px 0; }
  .today-time .now {
    font-family: 'DotGothic16', monospace;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .today-time .deadline { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .today-time .deadline b { color: var(--accent); font-size: 15px; }
  .today-time .snooze-count {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    background: var(--bg-2);
    border: 2px solid var(--ink);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }

  .wake-btn {
    width: 100%;
    padding: 18px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    color: white;
    background: var(--accent);
    border: 3px solid var(--ink);
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
    transition: all 0.1s;
    letter-spacing: 0.05em;
  }
  .wake-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .wake-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
  .wake-btn:disabled {
    background: #ddd;
    color: #888;
    cursor: not-allowed;
    box-shadow: 0 4px 0 #999;
    border-color: #999;
  }

  .status-badge {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 8px;
    border-radius: 12px;
  }
  .status-badge.cleared {
    background: rgba(127, 201, 158, 0.2);
    color: var(--success);
    border: 2px solid var(--success);
  }
  .status-badge.out {
    background: rgba(255, 107, 107, 0.15);
    color: var(--danger);
    border: 2px solid var(--danger);
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: rgba(255, 255, 255, 0.5);
    padding: 4px;
    border-radius: 16px;
    border: 2px solid var(--ink);
  }
  .tab {
    flex: 1;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .tab.active { background: var(--ink); color: white; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ===== カレンダー ===== */
  .cal-wrap {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 14px 10px;
    box-shadow: var(--shadow);
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav {
    background: var(--bg-1);
    border: 2px solid var(--ink);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
  }
  .cal-title { font-size: 18px; font-weight: 900; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 6px;
  }
  .cal-weekdays div {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    padding: 4px 0;
  }
  .cal-weekdays div.sun { color: var(--danger); }
  .cal-weekdays div.sat { color: #4a90d9; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    width: 100%;
  }
  .cal-cell {
    aspect-ratio: 1 / 1.15;
    min-width: 0;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 3px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    transition: transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .cal-cell.empty {
    background: transparent;
    cursor: default;
    pointer-events: none;
  }
  .cal-cell:not(.empty):hover { transform: scale(1.05); border-color: var(--ink); }
  .cal-cell.today {
    border-color: var(--accent);
    background: rgba(255, 122, 158, 0.15);
  }
  .cal-cell.has-shift {
    background: var(--bg-1);
  }
  .cal-cell.result-ok { background: rgba(127, 201, 158, 0.3); }
  .cal-cell.result-ng { background: rgba(255, 107, 107, 0.2); }
  .cal-cell .day-num {
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
  }
  .cal-cell .shift-dot {
    font-size: 8px;
    padding: 1px 3px;
    border-radius: 5px;
    background: var(--accent-2);
    color: white;
    font-weight: 700;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
  }
  .cal-cell .result-icon {
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 9px;
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 46, 42, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 20px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 0 rgba(61, 46, 42, 0.3);
  }
  .modal h3 {
    font-size: 16px;
    margin-bottom: 14px;
    font-weight: 900;
  }
  .modal-shift-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .modal-shift-btn {
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
  }
  .modal-shift-btn:hover { background: var(--bg-1); }
  .modal-shift-btn.selected {
    background: var(--accent);
    color: white;
  }
  .modal-shift-btn.unset { color: var(--ink-soft); font-style: italic; }
  .modal-close {
    width: 100%;
    padding: 10px;
    font-family: inherit;
    font-weight: 700;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  /* ===== シフト管理 ===== */
  .shift-list {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .week-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  .shift-item {
    background: var(--bg-1);
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .shift-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .shift-item-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .field-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 3px;
    letter-spacing: 0.05em;
  }
  .field input, .field select {
    width: 100%;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    background: white;
  }
  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink-soft);
    padding: 4px 8px;
  }
  .icon-btn:hover { color: var(--danger); }
  .add-shift-btn {
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: white;
    border: 2px dashed var(--ink);
    border-radius: 16px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-shift-btn:hover { background: var(--bg-1); }

  /* ===== 履歴 ===== */
  .history-list {
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .history-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px dashed var(--ink-soft);
    font-size: 14px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .date { flex: 1; }
  .history-item .result {
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .history-item .result.ok { background: rgba(127, 201, 158, 0.2); color: var(--success); }
  .history-item .result.ng { background: rgba(255, 107, 107, 0.15); color: var(--danger); }
  .history-empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 20px;
    font-size: 13px;
  }

  /* ===== アラーム通知 ===== */
  .alarm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 122, 158, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
  }
  .alarm-overlay.show { display: flex; }
  .alarm-text {
    font-size: 32px;
    font-weight: 900;
    color: white;
    text-shadow: 0 3px 0 var(--ink);
    animation: shake 0.5s infinite;
    text-align: center;
  }
  .alarm-time {
    font-family: 'DotGothic16', monospace;
    font-size: 48px;
    color: white;
    text-shadow: 0 3px 0 var(--ink);
    font-weight: 700;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .alarm-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 280px;
  }
  .alarm-btn {
    padding: 18px 20px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    border: 4px solid var(--ink);
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
  }
  .alarm-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .alarm-btn.wake { background: white; color: var(--ink); }
  .alarm-btn.snooze { background: var(--accent-2); color: white; }
  .alarm-btn.home {
    background: var(--ink);
    color: white;
    text-decoration: none;
    display: block;
    text-align: center;
    font-size: 14px;
  }
  .alarm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .snooze-info {
    color: white;
    font-size: 13px;
    text-align: center;
    text-shadow: 0 1px 0 var(--ink);
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back-link" href="index.html">← 戻る</a>
    <div class="topbar-spacer"></div>
  </div>

  <div class="header">
    <h1>🌅 もちまる起床ゲーム 🌅</h1>
    <div class="sub">WAKE UP WITH MOCHIMARU</div>
  </div>

  <div class="mochi-stage">
    <svg class="mochi-svg" id="mochi" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="180" rx="60" ry="6" fill="rgba(61,46,42,0.15)"/>
      <ellipse cx="100" cy="115" rx="70" ry="60" fill="#fffaf0" stroke="#3d2e2a" stroke-width="3.5"/>
      <ellipse cx="55" cy="125" rx="11" ry="8" fill="#ffb3c6" opacity="0.7"/>
      <ellipse cx="145" cy="125" rx="11" ry="8" fill="#ffb3c6" opacity="0.7"/>
      <g id="eyes">
        <circle cx="78" cy="105" r="5" fill="#3d2e2a"/>
        <circle cx="122" cy="105" r="5" fill="#3d2e2a"/>
        <circle cx="80" cy="103" r="1.5" fill="white"/>
        <circle cx="124" cy="103" r="1.5" fill="white"/>
      </g>
      <g id="mouth">
        <path d="M 92 130 Q 100 138 108 130" stroke="#3d2e2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <circle cx="100" cy="52" r="4" fill="#3d2e2a"/>
      <path d="M 100 56 L 100 62" stroke="#3d2e2a" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="mochi-message" id="mochiMessage">おはよう、ふうかちゃん</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="streakNum">0</div>
      <div class="label">連続クリア日数</div>
    </div>
    <div class="stat best">
      <div class="num" id="bestNum">0</div>
      <div class="label">最高記録</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="today">今日</button>
    <button class="tab" data-tab="calendar">カレンダー</button>
    <button class="tab" data-tab="shifts">シフト</button>
    <button class="tab" data-tab="history">履歴</button>
  </div>

  <div class="panel active" id="panel-today">
    <div class="today">
      <div class="today-head">
        <div class="day" id="todayLabel">--</div>
        <div class="shift-name" id="todayShiftName">--</div>
      </div>
      <div class="today-time">
        <div class="now" id="nowClock">--:--:--</div>
        <div class="deadline" id="deadlineLine">--</div>
        <div id="snoozeIndicator"></div>
      </div>
      <button class="wake-btn" id="wakeBtn">起きた！ ✨</button>
      <div id="statusBadge"></div>
    </div>
  </div>

  <div class="panel" id="panel-calendar">
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" id="prevMonth">◀</button>
        <div class="cal-title" id="calTitle">----年--月</div>
        <button class="cal-nav" id="nextMonth">▶</button>
      </div>
      <div class="cal-weekdays">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="panel" id="panel-shifts">
    <div class="shift-list">
      <div class="week-title">⏰ シフトテンプレート</div>
      <div id="shiftItems"></div>
      <button class="add-shift-btn" id="addShiftBtn">＋ シフトを追加</button>
    </div>
  </div>

  <div class="panel" id="panel-history">
    <div class="history-list">
      <div class="week-title">📖 起床ログ</div>
      <div id="historyItems"></div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="dayModal">
  <div class="modal">
    <h3 id="dayModalTitle">日付のシフトを選ぶ</h3>
    <div class="modal-shift-list" id="dayModalList"></div>
    <button class="modal-close" id="dayModalClose">閉じる</button>
  </div>
</div>

<div class="alarm-overlay" id="alarmOverlay">
  <div class="alarm-text">⏰ おきて〜！ ⏰</div>
  <div class="alarm-time" id="alarmTime">--:--</div>
  <div class="snooze-info" id="alarmSnoozeInfo"></div>
  <div class="alarm-buttons">
    <button class="alarm-btn wake" id="alarmWake">起きた！ ✨</button>
    <button class="alarm-btn snooze" id="alarmSnooze">あと3分... 😴</button>
    <a class="alarm-btn home" href="index.html">🏠 ホームに戻る</a>
  </div>
</div>

const DAYS_JP = ['日', '月', '火', '水', '木', '金', '土'];

const defaultData = {
  shifts: [
    { id: 's1', name: '勤務日', deadline: '07:00', sound: 'beep', alarmTime: '06:30' },
    { id: 's2', name: '休日', deadline: '09:30', sound: 'birds', alarmTime: '09:00' }
  ],
  calendar: {},
  streak: 0,
  best: 0,
  history: [],
  lastCheckDate: null,
  todayCleared: false,
  todayFailed: false,
  alarmFiredFor: null,
  snoozeCount: 0,
  snoozeUntil: null
};

function loadData() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return { ...defaultData, ...JSON.parse(stored) };
  } catch (e) {}
  return { ...defaultData };
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadData();
let calViewYear, calViewMonth;

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayKey() { return dateKey(new Date()); }

function getShiftForDate(dKey) {
  const shiftId = state.calendar[dKey];
  if (!shiftId) return null;
  return state.shifts.find(s => s.id === shiftId) || null;
}
function getTodayShift() { return getShiftForDate(todayKey()); }

function parseTime(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function formatTimeLeft(ms) {
  if (ms < 0) return '期限切れ';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}時間${m}分`;
  return `${m}分${s}秒`;
}

function checkDateChange() {
  const today = todayKey();
  if (state.lastCheckDate && state.lastCheckDate !== today) {
    if (!state.todayCleared && !state.todayFailed) {
      const prevShift = getShiftForDate(state.lastCheckDate);
      if (prevShift) {
        state.history.unshift({ date: state.lastCheckDate, result: 'ng' });
        state.streak = 0;
      }
    }
    state.todayCleared = false;
    state.todayFailed = false;
    state.alarmFiredFor = null;
    state.snoozeCount = 0;
    state.snoozeUntil = null;
  }
  state.lastCheckDate = today;
  if (state.history.length > 60) state.history = state.history.slice(0, 60);
  saveData();
}

function updateMochi() {
  const eyes = document.getElementById('eyes');
  const mouth = document.getElementById('mouth');
  const msg = document.getElementById('mochiMessage');

  if (state.todayCleared) {
    eyes.innerHTML = `
      <path d="M 70 105 Q 78 98 86 105" stroke="#3d2e2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 114 105 Q 122 98 130 105" stroke="#3d2e2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    `;
    mouth.innerHTML = `<path d="M 88 130 Q 100 142 112 130" stroke="#3d2e2a" stroke-width="2.5" fill="#ff7a9e" stroke-linecap="round"/>`;
    msg.textContent = '🎉 きょうもクリアだよ〜！';
    msg.className = 'mochi-message success';
  } else if (state.todayFailed) {
    eyes.innerHTML = `
      <path d="M 70 108 Q 78 115 86 108" stroke="#3d2e2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 114 108 Q 122 115 130 108" stroke="#3d2e2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="78" cy="115" r="2" fill="#6bb6ff"/>
    `;
    mouth.innerHTML = `<path d="M 92 135 Q 100 128 108 135" stroke="#3d2e2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    msg.textContent = '...あしたがあるよ';
    msg.className = 'mochi-message danger';
  } else {
    eyes.innerHTML = `
      <circle cx="78" cy="105" r="5" fill="#3d2e2a"/>
      <circle cx="122" cy="105" r="5" fill="#3d2e2a"/>
      <circle cx="80" cy="103" r="1.5" fill="white"/>
      <circle cx="124" cy="103" r="1.5" fill="white"/>
    `;
    mouth.innerHTML = `<path d="M 92 130 Q 100 138 108 130" stroke="#3d2e2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    msg.textContent = 'おはよう、ふうかちゃん';
    msg.className = 'mochi-message';
  }
}

function renderToday() {
  const now = new Date();
  const dayName = DAYS_JP[now.getDay()];
  const shift = getTodayShift();

  document.getElementById('todayLabel').textContent =
    `${now.getMonth()+1}月${now.getDate()}日（${dayName}）`;

  const shiftNameEl = document.getElementById('todayShiftName');
  if (shift) {
    shiftNameEl.textContent = shift.name;
    shiftNameEl.className = 'shift-name';
  } else {
    shiftNameEl.textContent = '未設定';
    shiftNameEl.className = 'shift-name unset';
  }

  document.getElementById('nowClock').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  const deadlineLine = document.getElementById('deadlineLine');
  const snoozeIndicator = document.getElementById('snoozeIndicator');
  snoozeIndicator.innerHTML = '';

  if (shift) {
    const deadline = parseTime(shift.deadline);
    const diff = deadline - now;
    deadlineLine.innerHTML = diff > 0
      ? `期限まで <b>${formatTimeLeft(diff)}</b>（${shift.deadline}）`
      : `<b style="color:var(--danger)">期限切れ（${shift.deadline}）</b>`;

    if (state.snoozeCount > 0) {
      snoozeIndicator.innerHTML = `<span class="snooze-count">😴 スヌーズ ${state.snoozeCount}回</span>`;
    }

    let alarmFireTime;
    if (state.snoozeUntil) {
      alarmFireTime = new Date(state.snoozeUntil);
    } else {
      alarmFireTime = parseTime(shift.alarmTime);
    }

    const alarmKey = `${todayKey()}-${alarmFireTime.getTime()}`;
    if (!state.todayCleared && !state.todayFailed &&
        now >= alarmFireTime && now < new Date(alarmFireTime.getTime() + 60000) &&
        state.alarmFiredFor !== alarmKey) {
      state.alarmFiredFor = alarmKey;
      saveData();
      fireAlarm();
    }

    if (diff < 0 && !state.todayCleared && !state.todayFailed) {
      state.todayFailed = true;
      state.history.unshift({ date: todayKey(), result: 'ng' });
      state.streak = 0;
      state.snoozeUntil = null;
      saveData();
      stopAlarm();
      updateMochi();
      renderStats();
    }
  } else {
    deadlineLine.innerHTML = `<span style="color:var(--ink-soft)">この日はシフト未設定だよ</span>`;
  }

  const btn = document.getElementById('wakeBtn');
  const badge = document.getElementById('statusBadge');
  if (!shift) {
    btn.disabled = true;
    btn.textContent = 'シフト未設定';
    badge.className = '';
    badge.textContent = '';
  } else if (state.todayCleared) {
    btn.disabled = true;
    btn.textContent = '✅ クリア済み';
    badge.className = 'status-badge cleared';
    badge.textContent = `🌟 ${state.streak}日連続クリア中！`;
  } else if (state.todayFailed) {
    btn.disabled = true;
    btn.textContent = '😢 アウト';
    badge.className = 'status-badge out';
    badge.textContent = '記録がリセットされたよ...';
  } else {
    btn.disabled = false;
    btn.textContent = '起きた！ ✨';
    badge.className = '';
    badge.textContent = '';
  }
}

function renderStats() {
  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('bestNum').textContent = state.best;
}

function renderCalendar() {
  document.getElementById('calTitle').textContent = `${calViewYear}年${calViewMonth+1}月`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calViewYear, calViewMonth, 1);
  const lastDay = new Date(calViewYear, calViewMonth + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = todayKey();

  const histMap = {};
  state.history.forEach(h => { histMap[h.date] = h.result; });

  for (let i = 0; i < startWeekday; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    grid.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(calViewYear, calViewMonth, d);
    const dk = dateKey(dt);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dk === today) cell.classList.add('today');

    const shift = getShiftForDate(dk);
    if (shift) cell.classList.add('has-shift');

    const result = histMap[dk];
    if (result === 'ok') cell.classList.add('result-ok');
    else if (result === 'ng') cell.classList.add('result-ng');

    let inner = `<div class="day-num">${d}</div>`;
    if (result === 'ok') inner += `<div class="result-icon">⭐</div>`;
    else if (result === 'ng') inner += `<div class="result-icon">💧</div>`;
    if (shift) inner += `<div class="shift-dot">${shift.name}</div>`;

    cell.innerHTML = inner;
    cell.addEventListener('click', () => openDayModal(dk));
    grid.appendChild(cell);
  }
}

function openDayModal(dKey) {
  const [y, m, d] = dKey.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dayName = DAYS_JP[dt.getDay()];
  document.getElementById('dayModalTitle').textContent =
    `${m}月${d}日（${dayName}）のシフト`;

  const list = document.getElementById('dayModalList');
  const currentShiftId = state.calendar[dKey] || '';
  list.innerHTML = '';

  const unsetBtn = document.createElement('button');
  unsetBtn.className = 'modal-shift-btn unset' + (!currentShiftId ? ' selected' : '');
  unsetBtn.textContent = '— 未設定（休む）—';
  unsetBtn.addEventListener('click', () => {
    delete state.calendar[dKey];
    saveData();
    renderCalendar();
    renderToday();
    closeDayModal();
  });
  list.appendChild(unsetBtn);

  state.shifts.forEach(shift => {
    const btn = document.createElement('button');
    btn.className = 'modal-shift-btn' + (shift.id === currentShiftId ? ' selected' : '');
    btn.innerHTML = `<div>${shift.name}</div><div style="font-size:11px;opacity:0.7;margin-top:2px;">アラーム ${shift.alarmTime} / 期限 ${shift.deadline}</div>`;
    btn.addEventListener('click', () => {
      state.calendar[dKey] = shift.id;
      saveData();
      renderCalendar();
      renderToday();
      closeDayModal();
    });
    list.appendChild(btn);
  });

  document.getElementById('dayModal').classList.add('show');
}

function closeDayModal() {
  document.getElementById('dayModal').classList.remove('show');
}

document.getElementById('dayModalClose').addEventListener('click', closeDayModal);
document.getElementById('dayModal').addEventListener('click', e => {
  if (e.target.id === 'dayModal') closeDayModal();
});

document.getElementById('prevMonth').addEventListener('click', () => {
  calViewMonth--;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  calViewMonth++;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  renderCalendar();
});

function renderShifts() {
  const container = document.getElementById('shiftItems');
  container.innerHTML = '';
  state.shifts.forEach((shift, idx) => {
    const el = document.createElement('div');
    el.className = 'shift-item';
    el.innerHTML = `
      <div class="shift-item-head">
        <input type="text" value="${shift.name}" data-field="name" data-idx="${idx}"
          style="font-weight:700;font-size:15px;border:none;background:transparent;flex:1;outline:none;border-bottom:2px dashed var(--ink-soft);">
        <button class="icon-btn" data-del="${idx}">🗑</button>
      </div>
      <div class="shift-item-fields">
        <div class="field">
          <div class="field-label">アラーム時刻</div>
          <input type="time" value="${shift.alarmTime}" data-field="alarmTime" data-idx="${idx}">
        </div>
        <div class="field">
          <div class="field-label">起床期限</div>
          <input type="time" value="${shift.deadline}" data-field="deadline" data-idx="${idx}">
        </div>
        <div class="field" style="grid-column:1/-1">
          <div class="field-label">アラーム音</div>
          <select data-field="sound" data-idx="${idx}">
            <option value="beep" ${shift.sound==='beep'?'selected':''}>ピピピ（電子音）</option>
            <option value="birds" ${shift.sound==='birds'?'selected':''}>ピロロ（小鳥）</option>
            <option value="bell" ${shift.sound==='bell'?'selected':''}>チャイム</option>
            <option value="gentle" ${shift.sound==='gentle'?'selected':''}>やさしい音</option>
          </select>
        </div>
      </div>
    `;
    container.appendChild(el);
  });

  container.querySelectorAll('input, select').forEach(input => {
    input.addEventListener('change', e => {
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      state.shifts[idx][field] = e.target.value;
      saveData();
      renderCalendar();
      renderToday();
    });
  });

  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = +e.target.dataset.del;
      if (state.shifts.length <= 1) {
        alert('シフトは最低1つ必要だよ');
        return;
      }
      if (!confirm(`「${state.shifts[idx].name}」を削除する？\nカレンダーで割り当てていた日は未設定に戻るよ。`)) return;
      const removedId = state.shifts[idx].id;
      state.shifts.splice(idx, 1);
      Object.keys(state.calendar).forEach(k => {
        if (state.calendar[k] === removedId) delete state.calendar[k];
      });
      saveData();
      renderShifts();
      renderCalendar();
      renderToday();
    });
  });
}

function renderHistory() {
  const container = document.getElementById('historyItems');
  if (state.history.length === 0) {
    container.innerHTML = '<div class="history-empty">まだ記録がないよ〜</div>';
    return;
  }
  container.innerHTML = state.history.map(h => {
    const [y, m, d] = h.date.split('-');
    const date = new Date(+y, +m-1, +d);
    const dayName = DAYS_JP[date.getDay()];
    return `
      <div class="history-item">
        <div class="date">${+m}/${+d}（${dayName}）</div>
        <div class="result ${h.result==='ok'?'ok':'ng'}">${h.result==='ok'?'クリア':'アウト'}</div>
      </div>
    `;
  }).join('');
}

let audioCtx = null;
let alarmInterval = null;
let currentOscillators = [];

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', volume = 0.3) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.02);
  gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
  currentOscillators.push(osc);
}

function playSoundOnce(soundType) {
  if (soundType === 'beep') {
    [0, 0.15, 0.3].forEach(t => setTimeout(() => playTone(880, 0.1, 'square'), t*1000));
  } else if (soundType === 'birds') {
    [600, 800, 700, 900].forEach((f, i) => setTimeout(() => playTone(f, 0.12, 'sine'), i*120));
  } else if (soundType === 'bell') {
    playTone(523, 0.5, 'sine');
    setTimeout(() => playTone(659, 0.5, 'sine'), 200);
    setTimeout(() => playTone(784, 0.8, 'sine'), 400);
  } else if (soundType === 'gentle') {
    playTone(440, 1.2, 'sine', 0.2);
    setTimeout(() => playTone(554, 1.2, 'sine', 0.2), 300);
  }
}

function fireAlarm() {
  const shift = getTodayShift();
  if (!shift) return;
  const now = new Date();
  document.getElementById('alarmTime').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const deadline = parseTime(shift.deadline);
  const snoozeBtn = document.getElementById('alarmSnooze');
  const snoozeInfo = document.getElementById('alarmSnoozeInfo');
  const remaining = deadline - now;
  if (remaining > 3 * 60 * 1000) {
    snoozeBtn.disabled = false;
    snoozeInfo.textContent = `期限 ${shift.deadline} まで ${formatTimeLeft(remaining)} ／ スヌーズ ${state.snoozeCount}回`;
  } else {
    snoozeBtn.disabled = true;
    snoozeInfo.textContent = `⚠️ 期限まであと${formatTimeLeft(remaining)}！スヌーズできないよ`;
  }

  document.getElementById('alarmOverlay').classList.add('show');
  playSoundOnce(shift.sound);
  alarmInterval = setInterval(() => playSoundOnce(shift.sound), 2000);
}

function stopAlarm() {
  document.getElementById('alarmOverlay').classList.remove('show');
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  currentOscillators.forEach(o => { try { o.stop(); } catch(e){} });
  currentOscillators = [];
}

document.getElementById('alarmWake').addEventListener('click', () => { doWakeUp(); });

document.getElementById('alarmSnooze').addEventListener('click', () => {
  const shift = getTodayShift();
  if (!shift) return;
  const now = new Date();
  const deadline = parseTime(shift.deadline);
  const snoozeTarget = new Date(now.getTime() + 3 * 60 * 1000);

  if (snoozeTarget >= deadline) {
    alert('スヌーズしたら期限を超えちゃう！起きよう〜');
    return;
  }

  state.snoozeUntil = snoozeTarget.toISOString();
  state.snoozeCount += 1;
  state.alarmFiredFor = null;
  saveData();
  stopAlarm();
  renderToday();
});

function doWakeUp() {
  const shift = getTodayShift();
  if (!shift) return;
  const now = new Date();
  const deadline = parseTime(shift.deadline);
  if (now > deadline) {
    state.todayFailed = true;
    state.history.unshift({ date: todayKey(), result: 'ng' });
    state.streak = 0;
  } else {
    state.todayCleared = true;
    state.streak += 1;
    if (state.streak > state.best) state.best = state.streak;
    state.history.unshift({ date: todayKey(), result: 'ok' });
  }
  state.snoozeUntil = null;
  stopAlarm();
  saveData();
  updateMochi();
  renderStats();
  renderToday();
  renderCalendar();
  renderHistory();
}

document.getElementById('wakeBtn').addEventListener('click', doWakeUp);

document.getElementById('addShiftBtn').addEventListener('click', () => {
  const newId = 's' + Date.now();
  state.shifts.push({
    id: newId,
    name: '新しいシフト',
    deadline: '08:00',
    sound: 'beep',
    alarmTime: '07:30'
  });
  saveData();
  renderShifts();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

const now0 = new Date();
calViewYear = now0.getFullYear();
calViewMonth = now0.getMonth();

checkDateChange();
updateMochi();
renderStats();
renderToday();
renderCalendar();
renderShifts();
renderHistory();

setInterval(() => {
  checkDateChange();
  renderToday();
}, 1000);
</script>
